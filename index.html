<script>
const $=s=>document.getElementById(s),cv=$('c'),cx=cv.getContext('2d'),stage=$('stage');
const cl=(v,a,b)=>Math.max(a,Math.min(b,v)),mix=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t),rgb=(a,al=1)=>`rgba(${a[0]|0},${a[1]|0},${a[2]|0},${al})`;

let W,H,hy,f;const camH=1.9,HW=5.5;
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;hy=H*.4;f=Math.min(H*.95,W*1.1)}rs();addEventListener('resize',rs);
// ---- clima: km, cielo alto rgb, horizonte rgb, luz, lluvia, sol, nubes
const WX=[[0,70,60,120,255,160,100,.72,0,.9],[15,70,150,235,190,225,255,1.05,0,.3],[30,100,70,140,255,120,60,.8,0,1],[45,30,36,52,80,90,105,.42,1,0],[60,16,20,34,70,70,90,.4,.35,0],[75,100,130,190,255,205,140,.85,0,.7],[90,70,58,120,255,145,115,.75,0,.6],[105,110,140,210,255,225,165,1,0,1]];
const WXN=['Amanecer','Día','Atardecer','Tormenta','Lluvia sobre la obra','Después de la lluvia','Cielo de transición','Nuevo amanecer'];
const wx=k=>{let i=0;while(i<6&&k>WX[i+1][0])i++;const a=WX[i],b=WX[i+1],t=cl((k-a[0])/(b[0]-a[0]),0,1);return a.map((v,j)=>v+(b[j]-v)*t)};
const ST=[{km:5,ic:'🌅',t:'Este viaje comenzó siendo <em>desconocidos</em>…'},{km:15,ic:'☀️',t:'Nos volvimos a <em>encontrar</em>…'},{km:30,ic:'🌇',t:'Fuimos <em>felices</em>…'},{km:45,ic:'⛈️',t:'Pero no todo camino <em>es fácil</em>.',c:'#9fd0ff'},{km:60,ic:'🔧',t:'A veces hay que detenerse para <em>reparar</em> lo que se rompió.',tool:1,c:'#ffb45e'},{km:75,ic:'🌤️',t:'Y aunque el camino cambió, ambos nos <em>seguimos queriendo</em>.',c:'#bfe0ff'},{km:90,fork:1},{km:105,end:1}];
ST.forEach(s=>s.d=s.km*50);
// ---- mundo
const ZF=4515,S=z=>z<ZF?0:z<4575?(z-ZF)*.6:z<4780?36:z<4880?(4880-z)*.36:0,c0=()=>0,cL=z=>-S(z),cR=z=>S(z);
let sd=7;const R=()=>(sd=sd*16807%2147483647)/2147483647;
const ZN=[[0,'city'],[6,'tambo'],[13,'mcd'],[20,'mass'],[27,'repsol'],[34,'unt'],[41,'upao'],[48,'ceviche'],[54,'urban'],[59,'repair'],[68,'exit'],[80,'open']];
const zoneOf=k=>{let z='city';ZN.forEach(a=>{if(k>=a[0])z=a[1]});return z};
const LM={tambo:{tx:'TAMBO',pt:'TAMBO',bg:'#ffd800',fg:'#e4007c',c:'#ecd9e2',w:14,dep:14,h:6},mcd:{tx:"McDonald's",pt:'M',bg:'#c8102e',fg:'#ffc72c',c:'#7b4b2c',w:14,dep:16,h:7},mass:{tx:'Mass',pt:'Mass',bg:'#ffd400',fg:'#0a3fa8',c:'#2557bd',w:16,dep:24,h:8},repsol:{tx:'REPSOL',pt:'REPSOL',bg:'#ffffff',fg:'#e8590c',c:'#ececec',w:12,dep:14,h:5.6,y0:4.6,pil:1},unt:{tx:'UNIVERSIDAD NACIONAL DE TRUJILLO',pt:'UNT',bg:'#dcd4bf',fg:'#4a3f2a',c:'#cbc3ae',w:24,dep:5,h:9},upao:{tx:'UPAO',pt:'UPAO',bg:'#1747b3',fg:'#ffffff',c:'#2a5fd0',w:18,dep:26,h:17,win:1},maki:{tx:'MAKIPANDA',pt:'MAKIPANDA',bg:'#111111',fg:'#ffffff',c:'#2b2b2b',w:14,dep:14,h:6},mall:{tx:'MALL PLAZA',pt:'MALL',bg:'#111827',fg:'#f4c86a',c:'#4b5563',w:22,dep:18,h:12,win:1}};
const PAL=['#8c7f7a','#a89a86','#6f7a8a','#b7a58f','#7d8a7a','#9b6f6a'],SP=[];
// Fachadas reales integradas como edificios de la ciudad (no como imágenes flotantes).
const CITY_IMG={};
['room69-1','room69-2','luna-rosa','kfc','america-express','papax','chifa','dali','jardin-botanico','jardin-botanico-real','tatami-sushi-bar','real-plaza','chifa-real','el-uruguayo','naruto','barbarian'].forEach(n=>{const im=new Image();im.src='assets/'+n+'.webp';CITY_IMG[n]=im});
const END_IMG=new Image();END_IMG.src='assets/personaje-final.png';
let endReady=false;END_IMG.onload=()=>endReady=true;
function add(o){o.i=SP.length;o.cs=o.c?sh(o.c,.72):0;SP.push(o)}
function lm(k,z,side){const m=LM[k];add({t:'b',z,side,xi:9.2,nw:!m.win,...m});if(m.pt)add({t:'pole',z:z-4,side,xi:7.4,hh:m.h+5.5,tx:m.pt,bg:m.bg,fg:m.fg})}
for(let z=12;z<5350;z+=24){if(z>4480&&z<4930)continue;const k=z/50,zn=zoneOf(k),den=zn=='open'?.1:zn=='exit'?.4:.95;
 for(const side of[-1,1])if(R()<den){const low=zn=='open'||zn=='exit';add({t:'b',z,side,xi:9.4+R()*3,w:9+R()*7,dep:12+R()*8,h:low?3+R()*4:9+R()*(zn=='city'||zn=='urban'?30:16),c:PAL[R()*6|0]})}
 if(z%48==12)for(const side of[-1,1])add({t:'palm',z:z+8,side,xi:7+R()*.8});
 if(z%60==12)for(const side of[-1,1])add({t:'lamp',z:z+18,side,xi:6.2})}
[['tambo',6],['mcd',13],['mass',20],['repsol',27],['unt',34],['upao',41]].forEach(([k,km],j)=>{lm(k,(km+1.8)*50,j%2?1:-1);lm(k,(km+5)*50,j%2?-1:1)});
lm('maki',51*50,-1);
// Nuevos hitos: cada foto se convierte en una fachada con perspectiva, profundidad y sombra.
const PHOTO_SPOTS=[
 ['room69-1',8,-1,10,10,10],['room69-2',10,1,9,11,13],['luna-rosa',16,-1,8,8,9],
 ['kfc',23,1,10,10,8],['america-express',29,-1,12,11,8],['papax',36,1,9,9,7],
 ['chifa',43,-1,10,10,8],['dali',48,1,10,10,12],['jardin-botanico',55,-1,14,7,5],
 ['jardin-botanico-real',12,1,10,12,8],['tatami-sushi-bar',19,-1,11,12,7],['real-plaza',27,1,12,14,9],
 ['chifa-real',35,-1,9.5,9,13],['el-uruguayo',44,1,10,10,8],['naruto',52,-1,10,9,12],['barbarian',61,1,12,16,9]
];
PHOTO_SPOTS.forEach(([img,km,side,xi,w,h])=>add({t:'photo',z:km*50,side,xi,w,dep:8+R()*5,h,img,shade:.18}));
lm('mall',32*50,1);
for(let z=2420;z<2640;z+=5)add({t:'cart',z,side:1,xi:6.2+R()*.5,u:R()*4|0});
for(let z=2900;z<3400;z+=9)add({t:'cone',z,side:-1,xi:2.2});
add({t:'machine',z:3040,side:-1,xi:9});add({t:'machine',z:3210,side:1,xi:9.5});add({t:'pole',z:2880,side:1,xi:7,hh:4.4,tx:'PISTA EN REPARACIÓN',bg:'#ff7a00',fg:'#111111'});
SP.sort((a,b)=>a.z-b.z);
const PH=[],CR=[];for(let z=1900;z<2980;z+=26+R()*38)PH.push({z,x:(R()-.5)*8,r:.5+R()*.55});for(let z=1950;z<3000;z+=34)CR.push({z,x:(R()-.5)*8});
const ZS=[];for(let i=0;i<64;i++)ZS.push(2.2*Math.pow(800/2.2,i/63));
const MT=[];for(let i=0;i<40;i++)MT.push(.3+R()*.7);
// ---- estado
let d=0,sp=0,idx=0,state='menu',boost=0,brake=0,inp=0,lat=0,steer=0,chosen=0,fixed=false,bump=0,flash=0,last=0,camX=0,LIGHT=1,rep=0,toastT=0,bolt=0,drops=Array.from({length:300},()=>({x:Math.random(),y:Math.random(),v:.8+Math.random()*.9,l:10+Math.random()*16}));
const P=(x,y,z)=>[W/2+(x-camX)*f/z,hy+(camH-y)*f/z];
function poly(a,col){cx.fillStyle=col;cx.beginPath();a.forEach(([x,z],i)=>{const p=P(x,0,Math.max(z,1.6));i?cx.lineTo(p[0],p[1]):cx.moveTo(p[0],p[1])});cx.fill()}
function strip(c,a,b,col,pred){const L=[],Rr=[];for(const z of ZS){const za=d+z;if(pred&&!pred(za))continue;const ce=c(za);L.push([ce+(a.call?a(za):a),z]);Rr.push([ce+(b.call?b(za):b),z])}if(L.length>1)poly(L.concat(Rr.reverse()),col)}
function face(pl,p0,p1,hp,fl,fh,fn){cx.save();cx.beginPath();pl.forEach((p,i)=>i?cx.lineTo(p[0],p[1]):cx.moveTo(p[0],p[1]));cx.closePath();cx.clip();cx.transform((p1[0]-p0[0])/fl,(p1[1]-p0[1])/fl,0,hp/fh,p0[0],p0[1]);fn();cx.restore()}
const FN="'Barlow Condensed',Impact,sans-serif";
function ctn(s,fl,fh){let y0=0;if(s.tx){const bh=s.full?fh:fh*.36,by=s.full?0:fh*.05;cx.fillStyle=s.bg;cx.fillRect(0,by,fl,bh);cx.fillStyle=s.fg;cx.textAlign='center';cx.textBaseline='middle';cx.font='700 10px '+FN;const wd=cx.measureText(s.tx).width;cx.font=`700 ${Math.min(bh*.75,fl*.9/wd*10)}px `+FN;cx.fillText(s.tx,fl/2,by+bh*.55);y0=s.full?fh:fh*.47}
 if(!s.nw&&y0<fh){const rows=Math.max(1,((fh-y0)/33)|0),cols=Math.max(1,(fl/30)|0),rh=(fh-y0)/rows,cw=fl/cols,lit=1-LIGHT;for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){cx.fillStyle=((s.i*7+r*13+c*5)%10)/10<lit*1.1+.05?'#ffd98a':'rgba(120,150,190,.55)';cx.fillRect(c*cw+cw*.2,y0+r*rh+rh*.25,cw*.6,rh*.5)}}}
function box(s,rz){const ax=s.side*s.xi,bx=s.side*(s.xi+s.w),x0=Math.min(ax,bx),x1=Math.max(ax,bx),zn=Math.max(rz,1.8),zf=rz+s.dep,y0=s.y0||0,h=s.h;if(zf<1.9)return;
 const A=P(ax,h,zn),B=P(ax,h,zf),C=P(ax,y0,zf),D=P(ax,y0,zn);cx.fillStyle=s.cs;cx.beginPath();[A,B,C,D].forEach((p,i)=>i?cx.lineTo(p[0],p[1]):cx.moveTo(p[0],p[1]));cx.fill();
 face([A,B,C,D],A,B,D[1]-A[1],s.dep*10,(h-y0)*10,()=>ctn(s,s.dep*10,(h-y0)*10));
 if(rz>=1.8){const T=P(x0,h,zn),Rt=P(x1,h,zn),Bt=P(x0,y0,zn),Br=P(x1,y0,zn);cx.fillStyle=s.c;cx.fillRect(T[0],T[1],Rt[0]-T[0],Bt[1]-T[1]);face([T,Rt,Br,Bt],T,Rt,Bt[1]-T[1],s.w*10,(h-y0)*10,()=>ctn(s,s.w*10,(h-y0)*10))}
 if(s.pil){cx.strokeStyle='#d9d9d9';cx.lineWidth=Math.max(1,.35*f/zn);[[ax,zn+1],[bx,zn+1],[ax,zf-1],[bx,zf-1]].forEach(([x,z])=>{if(z<1.9)return;const a=P(x,0,z),b=P(x,y0,z);cx.beginPath();cx.moveTo(...a);cx.lineTo(...b);cx.stroke()})}}
const glows=[];
// Personaje de destino: aparece al final de la ruta como la persona que espera al piloto.
// La máscara radial desvanece el fondo de la ilustración para que no parezca una imagen flotante.
let endLayer;
// Personaje final integrado en el mundo: está físicamente a un costado de la carretera,
// no como una tarjeta/imagen superpuesta. Crece con la perspectiva mientras la moto se acerca.
function drawEndCharacter(km,t){
 if(!endReady || km<99.5)return;
 const DEST_Z=5268;
 const rz=DEST_Z-d;
 if(rz<8 || rz>360)return;
 const q=cl((km-99.5)/5.5,0,1);
 const xWorld=4.45;
 // Escala humana respecto a las palmeras y edificios: debe sentirse parte de la ciudad, no gigante.
 const hWorld=3.45+q*.20;
 const k=f/rz;
 const base=P(xWorld,0,rz);
 const top=P(xWorld,hWorld,rz);
 const sh=base[1]-top[1];
 if(sh<3)return;
 const sw=sh*(END_IMG.naturalWidth/END_IMG.naturalHeight);
 const x=base[0]-sw*.5;
 const y=base[1]-sh;
 // Sombra de contacto: hace que los pies pertenezcan al suelo de la escena.
 cx.save();
 cx.globalAlpha=.35+.25*q;
 cx.fillStyle='rgba(0,0,0,.7)';
 cx.beginPath();
 cx.ellipse(base[0],base[1]+Math.max(1,k*.12),Math.max(5,sw*.30),Math.max(2,sw*.07),0,0,Math.PI*2);
 cx.fill();
 // Halo muy discreto, como iluminación ambiental del destino.
 const glow=cx.createRadialGradient(base[0],base[1]-sh*.45,0,base[0],base[1]-sh*.45,Math.max(sw,sh)*.65);
 glow.addColorStop(0,'rgba(255,177,112,.13)');
 glow.addColorStop(1,'rgba(255,177,112,0)');
 cx.fillStyle=glow;
 cx.fillRect(x-sw*.55,y-sh*.15,sw*2.1,sh*1.25);
 cx.globalAlpha=1;
 // El cuerpo conserva sus colores originales; solo los bordes se integran suavemente con el entorno.
 if(!endLayer || endLayer.width!==Math.ceil(sw) || endLayer.height!==Math.ceil(sh)){
   endLayer=document.createElement('canvas');
   endLayer.width=Math.ceil(sw); endLayer.height=Math.ceil(sh);
 }
 const ex=endLayer.getContext('2d');
 ex.clearRect(0,0,endLayer.width,endLayer.height);
 ex.drawImage(END_IMG,0,0,endLayer.width,endLayer.height);
 const mask=ex.createRadialGradient(endLayer.width*.5,endLayer.height*.48,Math.min(endLayer.width,endLayer.height)*.22,endLayer.width*.5,endLayer.height*.5,Math.max(endLayer.width,endLayer.height)*.72);
 mask.addColorStop(0,'rgba(0,0,0,1)');
 mask.addColorStop(.78,'rgba(0,0,0,.98)');
 mask.addColorStop(.95,'rgba(0,0,0,.68)');
 mask.addColorStop(1,'rgba(0,0,0,0)');
 ex.globalCompositeOperation='destination-in';
 ex.fillStyle=mask;

 cx.fillStyle=`rgba(6,8,30,${(1-LIGHT)*.72})`;cx.fillRect(0,-20,W,H+40);
 cx.globalCompositeOperation='lighter';for(const[x,y,r,a]of glows){g=cx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(255,210,120,${a*.7})`);g.addColorStop(1,'rgba(255,210,120,0)');cx.fillStyle=g;cx.fillRect(x-r,y-r,2*r,2*r)}cx.globalCompositeOperation='source-over';
 // Personaje final: se dibuja después del velo de ambiente para conservar colores nítidos, pero antes de lluvia/efectos y de la moto.
 drawEndCharacter(km,t);
 if(sp>30){cx.lineWidth=1.3;for(let i=0;i<24;i++){const a=Math.random()*6.283,r1=H*(.2+Math.random()*.3),r2=r1+H*(.1+sp/500);cx.strokeStyle=`rgba(255,240,220,${(sp-30)/300})`;cx.beginPath();cx.moveTo(W/2+Math.cos(a)*r1*1.6,hy+Math.sin(a)*r1);cx.lineTo(W/2+Math.cos(a)*r2*1.6,hy+Math.sin(a)*r2);cx.stroke()}
   // Líneas laterales de perspectiva: el entorno se desplaza hacia el piloto, no solo cambia de imagen.
   cx.lineWidth=1;for(let i=0;i<18;i++){const side=i%2?-1:1, yy=hy+Math.random()*H*.38, xx=W/2+side*(W*.28+Math.random()*W*.28), len=18+sp*.35;cx.strokeStyle=`rgba(255,220,180,${.035+sp*.0009})`;cx.beginPath();cx.moveTo(xx,yy);cx.lineTo(xx-side*len,yy+len*.28);cx.stroke()}}
 if(rain>.02){cx.strokeStyle=`rgba(200,220,255,${.25+rain*.2})`;cx.lineWidth=1.3;cx.beginPath();const n=Math.floor(drops.length*rain);for(let i=0;i<n;i++){const o=drops[i];o.y+=o.v*dt*1.9+sp/9000;o.x-=dt*.1;if(o.y>1){o.y=-.05;o.x=Math.random()+.1}if(o.x<-.1)o.x=1.1;const x=o.x*W,y=o.y*H;cx.moveTo(x,y);cx.lineTo(x-o.l*.2,y+o.l)}cx.stroke()}
 if(rain>.7&&Math.random()<dt*.2){flash=1;bolt=Math.random()*W;setTimeout(thunder,500+Math.random()*700)}
 if(flash>.35){cx.strokeStyle='rgba(235,240,255,.9)';cx.lineWidth=2.5;cx.beginPath();let x=bolt,y=0;cx.moveTo(x,y);while(y<hy*.95){x+=(Math.random()-.5)*40;y+=hy*.12;cx.lineTo(x,y)}cx.stroke()}
 flash*=Math.pow(.004,dt);if(flash>.03){cx.fillStyle=`rgba(225,232,255,${flash*.5})`;cx.fillRect(0,-20,W,H+40)}
 cx.restore();
 bike(t);aud(rain)}
